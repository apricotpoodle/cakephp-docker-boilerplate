# /docker-compose.yml
services:
  daeia:
    env_file:
      - .env

    environment:
      APP_HOST_HOSTNAME: ${APP_HOST_HOSTNAME:-${HOSTNAME:-non-renseigne}}
      TZ: ${APP_DEFAULT_TIMEZONE:-Europe/Paris}

    build:
      context: ./.dockerfile/
      network: host
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      - ./app:/var/www/html
      - ./localhost.crt:/etc/ssl/site/server.crt
      - ./localhost.key:/etc/ssl/site/server.key

    ports:
      - "${FORWARD_APACHE_PORT:-80}:80"
      - "${FORWARD_APACHE_PORT_HTTPS:-443}:443"

    networks:
      - network1

    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  network1:
    name: ${PROJECT_NETWORK:-devfab}
    external: true
