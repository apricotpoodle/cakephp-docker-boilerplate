# /docker-compose.yml
services:
  gdaetf:
    # Charge les variables dynamiques (ports, db, etc.)
    env_file:
      - .env

    environment:
      # Nom stable de la machine hôte, injectable dans les alertes techniques.
      APP_HOST_HOSTNAME: ${APP_HOST_HOSTNAME:-${HOSTNAME:-non-renseigne}}

    build:
      context: ./.dockerfile/
      args:
        # Passage des variables de votre Makefile vers le Dockerfile
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    restart: unless-stopped

    # Vérification régulière de la santé du conteneur web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      # Montage du code source applicatif (découplage)
      - ./app:/var/www/html
      # Montage des certificats SSL locaux
      - ./localhost.crt:/etc/ssl/site/server.crt
      - ./localhost.key:/etc/ssl/site/server.key

    ports:
      # Mapping des ports selon votre fichier .env
      - "${FORWARD_APACHE_PORT:-80}:80"
      - "${FORWARD_APACHE_PORT_HTTPS:-443}:443"

    networks:
      - network1

    # INDISPENSABLE POUR XDEBUG SOUS LINUX :
    # Permet au conteneur de résoudre l'adresse "host.docker.internal"
    # pour envoyer les informations de débogage vers VSCodium.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 💡 AJOUT : Service d'interception des courriels (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: gdaetf_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Interface Web Mailpit (consultation des mails)
      - "1025:1025" # Écoute SMTP
    networks:
      - network1

networks:
  network1:
    # Le nom du réseau dépend de votre .env (ex: gestion_dev31 ou devfab)
    name: ${PROJECT_NETWORK:-devfab}
    external: true
